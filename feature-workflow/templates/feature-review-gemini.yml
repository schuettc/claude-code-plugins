name: Feature Review (Gemini)

on:
  pull_request:
    types: [labeled, synchronize]

# Cancel in-progress runs for the same PR; the latest event wins.
# Prevents duplicate review comments from interleaving label-swap +
# synchronize events.
concurrency:
  group: feature-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  plan-review:
    if: contains(github.event.pull_request.labels.*.name, 'plan-review') && !contains(github.event.pull_request.labels.*.name, 'impl-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Load review prompt
        id: prompt
        run: |
          {
            echo 'value<<PROMPT_EOF'
            cat .github/review-prompt-plan.md
            echo ''
            echo "Review PR #${{ github.event.pull_request.number }} in this repo."
            echo "The PR branch is ${{ github.head_ref }} targeting ${{ github.base_ref }}."
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          prompt: ${{ steps.prompt.outputs.value }}
          gemini_api_key: ${{ secrets.GOOGLE_API_KEY }}

      - name: Post review
        if: always() && steps.gemini.outputs.summary != ''
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_KIND: Plan
          GEMINI_SUMMARY: ${{ steps.gemini.outputs.summary }}
        run: |
          set -euo pipefail
          bash .github/scripts/post-review.sh

  impl-review:
    if: contains(github.event.pull_request.labels.*.name, 'impl-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Load review prompt
        id: prompt
        run: |
          {
            echo 'value<<PROMPT_EOF'
            cat .github/review-prompt-impl.md
            echo ''
            echo "Review PR #${{ github.event.pull_request.number }} in this repo."
            echo "The PR branch is ${{ github.head_ref }} targeting ${{ github.base_ref }}."
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          prompt: ${{ steps.prompt.outputs.value }}
          gemini_api_key: ${{ secrets.GOOGLE_API_KEY }}

      - name: Post review
        if: always() && steps.gemini.outputs.summary != ''
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_KIND: Implementation
          GEMINI_SUMMARY: ${{ steps.gemini.outputs.summary }}
        run: |
          set -euo pipefail
          bash .github/scripts/post-review.sh
