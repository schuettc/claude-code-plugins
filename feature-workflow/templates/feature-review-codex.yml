name: Feature Review (Codex)

on:
  pull_request:
    types: [labeled, synchronize]

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  plan-review:
    if: contains(github.event.pull_request.labels.*.name, 'plan-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build prompt with PR context
        id: prompt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p .github/runtime
          {
            cat .github/review-prompt-plan.md
            echo ''
            echo "Review PR #${PR_NUMBER} in this repo."
            echo "The PR branch is ${HEAD_REF} targeting ${BASE_REF}."
          } > .github/runtime/prompt-plan.md

      - id: codex
        uses: openai/codex-action@v1
        with:
          prompt-file: .github/runtime/prompt-plan.md
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Post review
        if: always() && steps.codex.outputs.final-message != ''
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_KIND: Plan
          GEMINI_SUMMARY: ${{ steps.codex.outputs.final-message }}
        run: |
          set -euo pipefail
          bash .github/scripts/post-review.sh

  impl-review:
    if: contains(github.event.pull_request.labels.*.name, 'impl-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build prompt with PR context
        id: prompt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p .github/runtime
          {
            cat .github/review-prompt-impl.md
            echo ''
            echo "Review PR #${PR_NUMBER} in this repo."
            echo "The PR branch is ${HEAD_REF} targeting ${BASE_REF}."
          } > .github/runtime/prompt-impl.md

      - id: codex
        uses: openai/codex-action@v1
        with:
          prompt-file: .github/runtime/prompt-impl.md
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Post review
        if: always() && steps.codex.outputs.final-message != ''
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_KIND: Implementation
          GEMINI_SUMMARY: ${{ steps.codex.outputs.final-message }}
        run: |
          set -euo pipefail
          bash .github/scripts/post-review.sh
